#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  # push:
  # pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  duckdb-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      extension_name: odbc_scanner
      duckdb_version: v2.0.0
      ci_tools_version: v2.0-cyanoptera
      extra_toolchains: python3;unixodbc;
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;'
      opt_in_archs: 'windows_arm64;'
      build_duckdb_shell: false

  duckdb-deploy:
    name: Deploy extension binaries
    needs: duckdb-build
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_deploy.yml@v2.0-cyanoptera
    secrets: inherit
    with:
      extension_name: odbc_scanner
      duckdb_version: v2.0.0
      ci_tools_version: v2.0-cyanoptera
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;'
      opt_in_archs: 'windows_arm64;'
      deploy_latest: ${{ startsWith(github.ref, 'refs/heads/v') || github.ref == 'refs/heads/main' }}
      deploy_versioned: ${{ startsWith(github.ref, 'refs/heads/v') || github.ref == 'refs/heads/main' }}
